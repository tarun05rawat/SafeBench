[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safebench"
version = "0.1.0"
description = "Empirical LLM safety evaluation harness for safety, robustness, and instruction-following tasks."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "SafeBench" }
]
dependencies = [
  "httpx>=0.27.0",
  "matplotlib>=3.8.0",
  "pandas>=2.2.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "seaborn>=0.13.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[project.scripts]
safebench = "safebench.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

